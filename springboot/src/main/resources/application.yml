# ============================================
# 这是示例配置，仓库中不包含真实的账号密码和密钥
# 本地使用时请把下方标注「请替换」的项改成自己的值
# （本地修改不会被提交，详见 README「配置说明」）
# ============================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant02?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: 你的数据库用户名
    password: 你的数据库密码

#服务器配置
server:
  port: 1236

# JWT配置
jwt:
  secret: 请替换为你自己的JWT签名密钥（建议32位以上随机字符串）
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀
